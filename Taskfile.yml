# @format

version: "3"

vars:
  API_PROJECT: "./GritTrack.Api/GritTrack.Api.csproj"
  DATA_PROJECT: "./GritTrack.Api/GritTrack.Api.csproj"

tasks:
  default:
    desc: List all available task commands
    cmds:
      - task --list

  dbup:
    desc: Start SQL Server in Podman container
    cmds:
      - podman compose up -d
      - podman compose ps

  dbdown:
    desc: Stop SQL Server container
    cmds:
      - podman compose down

  dblogs:
    desc: View SQL Server container logs
    cmds:
      - podman compose logs -f sql

  dbstatus:
    desc: Check Podman container health status
    cmds:
      - podman compose ps

  efup:
    desc: Updates the SQL database to the latest EF migration
    cmds:
      - dotnet ef database update --project {{.DATA_PROJECT}} --startup-project {{.API_PROJECT}}

  efadd:
    desc: Adds a new migration
      Usage task efadd -- MigrationName
    cmds:
      - dotnet ef migrations add {{.CLI_ARGS}} --project {{.DATA_PROJECT}} --startup-project {{.API_PROJECT}}

  apirun:
    desc: Run GritTrack API (JSON mode, login OFF, works on a fresh clone)
    cmds:
      - dotnet run --project GritTrack.Api

  apirun-auth:
    desc: Run GritTrack API with login ON (run api:secrets once first)
    env:
      Auth__Enabled: "true"
    cmds:
      - dotnet run --project GritTrack.Api

  apirun-sql:
    desc: Run GritTrack API with SQL Server data source
    env:
      DataSource: SqlServer
    cmds:
      - dotnet run --project GritTrack.Api

  apirun-noauth:
    desc: Run GritTrack API with Authentication OFF
    env:
      Auth__Enabled: "false"
    cmds:
      - dotnet run --project GritTrack.Api

  api:secrets:
    silent: true # keeps the typed password and key out of the terminal log
    desc: "Set the login secrets. Usage: task api:secrets SIGNING_KEY=<32+ random chars> DEMO_PASSWORD=<yours>"
    dir: GritTrack.Api
    # no secret values live in this file on purpose. you type your own
    requires:
      vars: [SIGNING_KEY, DEMO_PASSWORD]
    cmds:
      - dotnet user-secrets set "Auth:SigningKey" "{{.SIGNING_KEY}}"
      - dotnet user-secrets set "Auth:DemoPassword" "{{.DEMO_PASSWORD}}"

  app:run-windows:
    desc: Launch GritTrack MAUI app on Windows
    cmds:
      - dotnet run --project GritTrack/GritTrack.csproj -f net10.0-windows10.0.19041.0

  app:run-android:
    desc: Launch GritTrack MAUI app on Android emulator
    cmds:
      - dotnet run --project GritTrack/GritTrack.csproj -f net10.0-android

  test:
    desc: Run all xUnit test projects
    cmds:
      - dotnet test

  test:api:
    desc: Run API unit & integration tests
    cmds:
      - dotnet test GritTrack.Api.Tests/GritTrack.Api.Tests.csproj

  test:app:
    desc: Run MAUI App unit tests
    cmds:
      - dotnet test GritTrack.App.Tests/GritTrack.App.Tests.csproj

  postman:on:
    silent: true # keeps the typed password out of the terminal log
    desc: "Run Postman collection via Newman (Auth ON). Usage: task postman:on DEMO_PASSWORD=<yours>"
    requires:
      vars: [DEMO_PASSWORD]
    cmds:
      - newman run GritTrack.Api/postman/GritTrack.postman_collection.json -e GritTrack.Api/postman/GritTrack-AuthOn.postman_environment.json --env-var "demoPassword={{.DEMO_PASSWORD}}" --insecure

  postman:off:
    desc: Run Postman collection via Newman (Auth OFF)
    cmds:
      - newman run GritTrack.Api/postman/GritTrack.postman_collection.json -e GritTrack.Api/postman/GritTrack-AuthOff.postman_environment.json --insecure

  build:
    desc: Build solution
    cmds:
      - dotnet build

  clean:
    desc: Clean build outputs
    cmds:
      - dotnet clean
